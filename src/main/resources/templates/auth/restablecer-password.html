<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <title>Restablecer contraseña | Gestión de Proyectos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="login-page">
<main class="container min-vh-100 d-flex align-items-center justify-content-center py-4">
    <section class="card shadow w-100" style="max-width: 520px" aria-labelledby="titulo-restablecer">
        <div class="card-body p-4 p-md-5">
            <h1 id="titulo-restablecer" class="h3 mb-3">Nueva contraseña</h1>
            <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>
            <form th:if="${token != null and !token.isEmpty()}" th:action="@{/restablecer-password}" method="post">
                <input type="hidden" name="token" th:value="${token}">
                <label for="nuevaContrasena" class="form-label">Nueva contraseña</label>
                <input id="nuevaContrasena" name="nuevaContrasena" type="password" class="form-control mb-3"
                       autocomplete="new-password" minlength="8" maxlength="72" required>
                <label for="confirmarContrasena" class="form-label">Confirmar contraseña</label>
                <input id="confirmarContrasena" name="confirmarContrasena" type="password" class="form-control mb-3"
                       autocomplete="new-password" minlength="8" maxlength="72" required>
                <button type="submit" class="btn btn-primary w-100">Guardar contraseña</button>
            </form>
            <p th:if="${token == null or token.isEmpty()}" class="text-secondary">Solicita un nuevo enlace de recuperación.</p>
            <a class="d-inline-block mt-3" th:href="@{/recuperar-password}">Solicitar nuevo enlace</a>
        </div>
    </section>
</main>
</body>
</html>

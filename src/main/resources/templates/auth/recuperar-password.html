<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <title>Recuperar contraseña | Gestión de Proyectos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="login-page">
<main class="container min-vh-100 d-flex align-items-center justify-content-center py-4">
    <section class="card shadow w-100" style="max-width: 520px" aria-labelledby="titulo-recuperacion">
        <div class="card-body p-4 p-md-5">
            <h1 id="titulo-recuperacion" class="h3 mb-3">Recuperar contraseña</h1>
            <p class="text-secondary">Indica tu correo. Si tienes una cuenta, recibirás un enlace válido durante 30 minutos.</p>
            <div th:if="${mensaje}" class="alert alert-info" role="status" th:text="${mensaje}"></div>
            <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>
            <form th:action="@{/recuperar-password}" method="post">
                <label for="correoRecuperacion" class="form-label">Correo electrónico</label>
                <input id="correoRecuperacion" name="correo" type="email" autocomplete="email"
                       maxlength="150" class="form-control mb-3" required>
                <button type="submit" class="btn btn-primary w-100">Enviar enlace</button>
            </form>
            <a class="d-inline-block mt-3" th:href="@{/login}">Volver al inicio de sesión</a>
        </div>
    </section>
</main>
</body>
</html>

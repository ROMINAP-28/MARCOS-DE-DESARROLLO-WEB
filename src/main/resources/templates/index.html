
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Proyectos</title>

    <!-- Bootstrap: framework CSS para diseño responsive -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<!-- Bootstrap: organiza la página en columna y ocupa como mínimo toda la pantalla. -->
<body class="d-flex flex-column min-vh-100">

<!-- Thymeleaf: reutiliza la cabecera común del sistema. -->
<div th:replace="~{fragments/header :: header}"></div>

<main class="container py-5">
    <div id="app" class="text-center">
        <h1 class="display-5 fw-bold text-primary">
            {{ titulo }}
        </h1>
        <p class="lead mt-3">
            Organiza tus proyectos, gestiona tareas
            y trabaja en equipo desde un solo lugar.
        </p>
        <button class="btn btn-primary btn-lg mt-3"
                @click="mostrarMensaje">
            Comenzar
        </button>
        <p class="mt-3 text-success" v-if="mensaje">
            {{ mensaje }}
        </p>
    </div>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
<!-- Vue.js -->
<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
<script>
    const { createApp } = Vue;

    createApp({
        data() {
            return {
                titulo: 'Bienvenido al sistema',
                mensaje: ''
            };
        },
        methods: {
            mostrarMensaje() {
                this.mensaje = '¡Tu sistema de proyectos está listo para comenzar!';
            }
        }
    }).mount('#app');
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<!-- Thymeleaf: inserta el pie de página común en la página principal. -->

</body>
</html>

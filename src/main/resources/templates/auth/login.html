
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | Gestión de Proyectos</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- CSS global -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="login-page">

<main class="container-fluid min-vh-100 d-flex align-items-center justify-content-center py-4">
    <div class="row login-container shadow-lg overflow-hidden">

        <!-- Panel informativo -->
        <section class="col-lg-6 login-banner d-none d-lg-flex flex-column
                        justify-content-center align-items-center text-center p-5">
            <div class="login-logo mb-4">GP</div>
            <h1 class="fw-bold text-white">Gestiona tus proyectos</h1>
            <p class="text-white mt-3">
                Organiza tus tareas, colabora con tu equipo
                y lleva el control de tus proyectos desde un solo lugar.
            </p>
        </section>

        <!-- Formulario de inicio de sesión -->
        <section class="col-lg-6 bg-white p-4 p-md-5 d-flex flex-column justify-content-center">
            <div id="loginApp">

                <div class="text-center mb-4">
                    <h2 class="fw-bold">¡Bienvenido!</h2>
                    <p class="text-secondary">
                        Ingresa tus datos para continuar
                    </p>
                </div>

                <form @submit.prevent="iniciarSesion" novalidate>

                    <div class="mb-3">
                        <label for="correo" class="form-label fw-semibold">
                            Correo electrónico
                        </label>
                        <input
                                type="email"
                                id="correo"
                                class="form-control form-control-lg"
                                placeholder="ejemplo@correo.com"
                                v-model.trim="correo"
                                autocomplete="email"
                                required>
                    </div>

                    <div class="mb-3">
                        <label for="contrasena" class="form-label fw-semibold">
                            Contraseña
                        </label>

                        <div class="input-group input-group-lg">
                            <input
                                    :type="mostrarContrasena ? 'text' : 'password'"
                                    id="contrasena"
                                    class="form-control"
                                    placeholder="Ingresa tu contraseña"
                                    v-model="contrasena"
                                    autocomplete="current-password"
                                    required>

                            <button
                                    class="btn btn-outline-secondary"
                                    type="button"
                                    @click="mostrarContrasena = !mostrarContrasena">
                                {{ mostrarContrasena ? 'Ocultar' : 'Mostrar' }}
                            </button>
                        </div>
                    </div>

                    <div class="text-end mb-4">
                        <a th:href="@{/recuperar-password}"
                           class="text-decoration-none">
                            ¿Olvidaste tu contraseña?
                        </a>
                    </div>

                    <div v-if="mensaje"
                         class="alert alert-info"
                         role="status">
                        {{ mensaje }}
                    </div>

                    <button type="submit"
                            class="btn btn-primary btn-lg w-100">
                        Iniciar sesión
                    </button>
                </form>

                <div class="text-center mt-4">
                    <span class="text-secondary">
                        ¿No tienes una cuenta?
                    </span>
                    <a th:href="@{/registro}"
                       class="fw-semibold text-decoration-none">
                        Regístrate
                    </a>
                </div>

                <div class="text-center mt-4">
                    <a th:href="@{/}"
                       class="text-secondary text-decoration-none">
                        ← Volver al inicio
                    </a>
                </div>
            </div>
        </section>
    </div>
</main>

<!-- Vue.js -->
<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
<script>
    const { createApp } = Vue;

    createApp({
        data() {
            return {
                correo: '',
                contrasena: '',
                mostrarContrasena: false,
                mensaje: ''
            };
        },
        methods: {
            iniciarSesion() {
                if (!this.correo || !this.contrasena) {
                    this.mensaje = 'Completa todos los campos.';
                    return;
                }

                this.mensaje =
                    'Interfaz lista. La autenticación se conectará posteriormente con Spring Security.';
            }
        }
    }).mount('#loginApp');
</script>

</body>
</html>

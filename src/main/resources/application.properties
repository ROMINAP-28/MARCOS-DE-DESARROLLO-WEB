# Conexión PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/gestion_proyectos
spring.datasource.username=postgres
spring.datasource.password=6006

# Driver
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Sesiones de autenticación: cookie inaccesible a JavaScript y tiempo limitado.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m

# Recuperación de contraseña: configurar SPRING_MAIL_HOST, SPRING_MAIL_USERNAME,
# SPRING_MAIL_PASSWORD, APP_RECUPERACION_REMITENTE y APP_URL_PUBLICA en producción.
# Si no hay SMTP, la solicitud falla explícitamente sin crear enlaces inutilizables.
app.url-publica=${APP_URL_PUBLICA:http://localhost:8080}
app.recuperacion.remitente=${APP_RECUPERACION_REMITENTE:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
